<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品集 Works - Xu-Jiaqi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="works-page">
  <header>
    <nav>
      <a href="index.html" class="logo">Xu-Jiaqi</a>
      <div class="nav-links">
        <a href="profile.html">Profile</a>
        <a href="thoughts.html">Thoughts</a>
        <a href="works.html" class="active">Works</a>
      </div>
    </nav>
  </header>

  <main class="works-stage">
    <div class="works-backdrop" aria-hidden="true">
      <span class="works-backdrop-word">WORKS</span>
      <span class="works-backdrop-line line-a"></span>
      <span class="works-backdrop-line line-b"></span>
      <span class="works-backdrop-mark mark-a">+</span>
      <span class="works-backdrop-mark mark-b">×</span>
    </div>

    <section class="works-scene" aria-label="作品展示">
      <div class="works-scene-leftnote" aria-hidden="true">
        <span>ARCHIVE</span>
        <span>SELECTED WORK</span>
      </div>

      <div class="works-selected-wrap">
        <div class="works-flip-ring" aria-hidden="true"></div>
        <div class="works-selected-card" id="feature-cover" aria-hidden="true">
          <div class="selected-card-back" aria-hidden="true">
            <span class="back-line back-line-a"></span>
            <span class="back-line back-line-b"></span>
            <span class="back-diamond"></span>
            <span class="back-orbit"></span>
          </div>
          <div class="selected-card-border"></div>
          <div class="selected-card-art">
            <span class="art-axis axis-x"></span>
            <span class="art-axis axis-y"></span>
            <span class="art-ring ring-a"></span>
            <span class="art-ring ring-b"></span>
            <span class="art-core"></span>
            <span class="art-block block-a"></span>
            <span class="art-block block-b"></span>
            <span class="art-block block-c"></span>
          </div>
          <div class="selected-card-topline">
            <span id="feature-cover-label">NOTE</span>
            <span id="feature-cover-year">2026</span>
          </div>
          <div class="selected-card-bottom">
            <span id="feature-cover-title">Work</span>
            <span class="selected-card-arrow">↘</span>
          </div>
        </div>
      </div>

      <div class="works-selected-copy">
        <div class="works-counter">
          <span id="work-current">01</span>
          <span class="counter-line"></span>
          <span id="work-total">03</span>
        </div>
        <div class="works-kicker" id="work-category">NOTE</div>
        <h1 id="work-title">Loading…</h1>
        <div class="works-date" id="work-date"></div>
        <p class="works-summary" id="work-summary"></p>
        <button class="works-read-button" id="work-read" type="button">
          <span class="read-icon">↘</span>
          <span>阅读正文</span>
        </button>
      </div>

      <aside class="works-deck-wrap" aria-label="作品封面滑轨">
        <div class="deck-side-label" aria-hidden="true">
          <span>WORK INDEX</span>
          <span>SCROLL / DRAG</span>
        </div>
        <div class="works-deck-viewport">
          <div class="works-deck" id="works-deck" tabindex="0"></div>
        </div>
        <div class="deck-progress" id="deck-progress" aria-hidden="true"></div>
      </aside>

      <div class="works-scene-caption" aria-hidden="true">
        <strong>作品集</strong>
        <span>RESEARCH · PROJECTS · PAPERS · NOTES</span>
      </div>
    </section>

    <section class="works-article-shell" id="works-article-shell" hidden>
      <div class="works-article-toolbar">
        <span id="article-heading">Article</span>
        <button id="article-close" type="button" aria-label="关闭正文">×</button>
      </div>
      <article class="article-body works-article-body" id="article-body"></article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Xu-Jiaqi</p>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/showdown.min.js"></script>
  <script src="js/dompurify.min.js"></script>
  <script>
    window.__mathjaxWaiters = window.__mathjaxWaiters || [];
    window.MathJax = {
      loader: { load: ['[tex]/ams'] },
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true,
        packages: { '[+]': ['ams'] }
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };

    (function loadMathJax() {
      const candidates = [
        'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js',
        'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js'
      ];
      const onReady = () => {
        const waiters = window.__mathjaxWaiters || [];
        while (waiters.length) {
          const fn = waiters.shift();
          try { fn(); } catch (e) { console.error('Math waiter error:', e); }
        }
      };
      const tryLoad = (idx) => {
        if (idx >= candidates.length) return;
        const script = document.createElement('script');
        script.src = candidates[idx];
        script.async = true;
        script.onload = onReady;
        script.onerror = () => { script.remove(); tryLoad(idx + 1); };
        document.head.appendChild(script);
      };
      tryLoad(0);
    })();
  </script>
  <script src="js/works.js"></script>
</body>
</html>
